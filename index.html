<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>128x128-face-generator</title>
  <style>
    :root {
      --bg-workspace: #f3f4f6;
      --bg-sidebar: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --border-color: #e5e7eb;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-workspace);
    }

    /* --- Left Workspace (Preview) --- */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .canvas-container {
      background: #ffffff;
      padding: 40px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .canvas-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    canvas {
      width: 384px;
      /* 128pxの3倍表示 */
      height: 384px;
      image-rendering: pixelated;
    }

    /* トラックパッドでの拡大縮小/パン操作を受け止める表示窓（この枠内だけがクリップされる） */
    .canvas-viewport {
      position: relative;
      width: 384px;
      height: 384px;
      overflow: hidden;
      background: #000000;
      border: 1px solid #333;
    }

    #previewCanvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      cursor: pointer;
    }

    /* --- Right Sidebar (Controls) --- */
    .sidebar {
      width: 320px;
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 15px rgba(0, 0, 0, 0.02);
      z-index: 10;
    }

    .panel {
      padding: 24px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    /* Simple Upload Button */
    .upload-container {
      margin-bottom: 32px;
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    .hint-text {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 8px;
      display: block;
    }

    /* Input Controls */
    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .input-group input[type="text"],
    .input-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
      background-color: #fff;
    }

    .input-group select {
      font-family: var(--font-family);
      cursor: pointer;
    }

    .input-group input[type="text"]:focus,
    .input-group select:focus {
      border-color: var(--accent);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-row label {
      font-size: 12px;
      color: var(--text-sub);
      cursor: pointer;
      margin-bottom: 0;
    }

    .checkbox-row input[type="checkbox"] {
      cursor: pointer;
    }

    /* Output Area */
    textarea {
      width: 100%;
      height: 240px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      resize: vertical;
      margin-bottom: 12px;
    }

    /* Buttons */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .btn-outline:hover {
      background: #eff6ff;
    }
  </style>
</head>

<body>

  <!-- Left Workspace -->
  <main class="workspace">
    <div class="canvas-container">
      <div class="canvas-label">Preview (128x128)</div>
      <div class="canvas-viewport" id="canvasViewport">
        <!-- 内部処理用キャンバス(隠し) -->
        <canvas id="sourceCanvas" width="128" height="128" style="display:none;"></canvas>
        <!-- 表示用キャンバス -->
        <canvas id="previewCanvas" width="128" height="128"></canvas>
      </div>
    </div>
  </main>

  <!-- Right Sidebar -->
  <aside class="sidebar">
    <div class="panel">
      <div class="section-title">Image Source (PNG)</div>

      <div class="upload-container">
        <label class="btn btn-primary" for="fileInput">
          画像ファイルを選択
        </label>
        <input type="file" id="fileInput" accept="image/png, image/jpeg">
        <span class="hint-text" id="fileName"></span>
        <span class="hint-text">128x128px推奨 / 白黒画像</span>
      </div>

      <div class="section-title">Export Settings</div>

      <!-- 粗さ調整用プルダウン -->
      <div class="input-group">
        <label for="blockSize">レトロフィルター (粗さ)</label>
        <select id="blockSize">
          <option value="1">OFF (1倍: 128x128)</option>
          <option value="2">モザイク強 (2倍: 64x64相当)</option>
          <option value="4">モザイク最強 (4倍: 32x32相当)</option>
          <option value="8">超ローファイ (8倍: 16x16相当)</option>
        </select>
      </div>

      <!-- 編集の粒度（クリックで反転するセルの大きさ。レトロフィルターとは独立） -->
      <div class="input-group">
        <label for="editGranularity">編集の粒度 (クリックサイズ)</label>
        <select id="editGranularity">
          <option value="1">1x1 (最小)</option>
          <option value="2">2x2</option>
          <option value="4">4x4</option>
          <option value="8">8x8</option>
        </select>
      </div>

      <!-- ドットグリッド表示切り替え -->
      <div class="input-group">
        <div class="checkbox-row">
          <input type="checkbox" id="showGrid">
          <label for="showGrid">ドットグリッドを表示</label>
        </div>
        <span class="hint-text">プレビューをクリックするとドットのON/OFFを反転できます</span>
      </div>

      <div class="input-group">
        <label for="arrayName">配列名 (Array Name)</label>
        <input type="text" id="arrayName" value="FRAME_IDLE_A" placeholder="例: FRAME_IDLE_A">
      </div>

      <div class="section-title">C++ Code Output</div>
      <textarea id="output" placeholder="画像を取り込むとここにC++配列が出力されます..."></textarea>

      <button class="btn btn-outline" id="copyBtn">コードをクリップボードにコピー</button>
      <div style="height: 24px;"></div>
      <button class="btn btn-outline" id="exportPngBtn">PNG画像としてエクスポート</button>
    </div>
  </aside>

  <script>
    const fileInput = document.getElementById('fileInput');
    const sourceCanvas = document.getElementById('sourceCanvas');
    const previewCanvas = document.getElementById('previewCanvas');
    const sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });
    const previewCtx = previewCanvas.getContext('2d');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    const exportPngBtn = document.getElementById('exportPngBtn');
    const fileNameDisplay = document.getElementById('fileName');
    const arrayNameInput = document.getElementById('arrayName');
    const blockSizeInput = document.getElementById('blockSize');
    const editGranularityInput = document.getElementById('editGranularity');
    const showGridInput = document.getElementById('showGrid');
    const canvasViewport = document.getElementById('canvasViewport');

    let currentImg = null;
    let dotState = null; // 128x128 のドットON/OFF状態（手動編集を保持する）
    let currentCellSize = parseInt(editGranularityInput.value, 10); // グリッド表示/クリック判定用のセルサイズ（レトロフィルターとは独立）

    // --- トラックパッドによるFigma風の拡大縮小/パン ---
    let zoomScale = 1;
    let panX = 0;
    let panY = 0;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 20;
    const VIEWPORT_SIZE = 384; // canvas-viewportの表示サイズ(px)と一致させる

    // --- クリック編集のUndo/Redo履歴 ---
    let undoStack = [];
    let redoStack = [];
    const MAX_HISTORY = 50;

    function cloneDotState(state) {
      return state.map(row => row.slice());
    }

    // 編集前の状態を履歴に積む（新しい編集でRedo履歴は破棄）
    function pushUndoSnapshot() {
      undoStack.push(cloneDotState(dotState));
      if (undoStack.length > MAX_HISTORY) undoStack.shift();
      redoStack.length = 0;
    }

    // 画像の再読み込みや粗さ変更でドット配列自体が作り直されたら履歴をリセット
    function resetHistory() {
      undoStack = [];
      redoStack = [];
    }

    function undo() {
      if (!dotState || undoStack.length === 0) return;
      redoStack.push(cloneDotState(dotState));
      dotState = undoStack.pop();
      render();
    }

    function redo() {
      if (!dotState || redoStack.length === 0) return;
      undoStack.push(cloneDotState(dotState));
      dotState = redoStack.pop();
      render();
    }

    // Command+Z / Command+Shift+Z（Win/LinuxはCtrl）でUndo/Redo
    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() !== 'z') return;
      const isUndoRedoCombo = e.metaKey || e.ctrlKey;
      if (!isUndoRedoCombo) return;

      // テキスト入力欄にフォーカスがある場合はブラウザ標準のUndo/Redoに任せる
      const target = e.target;
      if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) return;

      e.preventDefault();
      if (e.shiftKey) {
        redo();
      } else {
        undo();
      }
    });
    // ------------------------------------

    // ファイル読み込み処理
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileNameDisplay.textContent = file.name;

      const img = new Image();
      img.onload = () => {
        currentImg = img;
        processImage();
      };
      img.src = URL.createObjectURL(file);
    });

    // 配列名が変更されたら再描画（ドット状態はそのまま）
    arrayNameInput.addEventListener('input', () => { if (dotState) render(); });

    // 粗さ（レトロフィルター）が変更されたら、現在のドット状態（編集済み）にモザイクを再適用する
    // ※画像から再生成し直すわけではないので、手動編集は保持される
    blockSizeInput.addEventListener('change', () => {
      if (!dotState) return;
      reapplyRetroFilter(parseInt(blockSizeInput.value, 10));
    });

    // 編集の粒度が変更されたら、グリッド/クリック判定サイズだけを更新する（ドット状態はそのまま）
    editGranularityInput.addEventListener('change', () => {
      currentCellSize = parseInt(editGranularityInput.value, 10);
      if (dotState) render();
    });

    // グリッド表示切り替え時は再描画のみ
    showGridInput.addEventListener('change', () => { if (dotState) render(); });

    // プレビューをクリックしてドットのON/OFFを反転する
    previewCanvas.addEventListener('click', (e) => {
      if (!dotState) return;

      const rect = previewCanvas.getBoundingClientRect();
      const scaleX = previewCanvas.width / rect.width;
      const scaleY = previewCanvas.height / rect.height;
      const px = Math.floor((e.clientX - rect.left) * scaleX);
      const py = Math.floor((e.clientY - rect.top) * scaleY);
      if (px < 0 || px >= 128 || py < 0 || py >= 128) return;

      // クリック位置が属するグリッドセル全体をまとめて反転する
      const cellSize = currentCellSize;
      const cellX = Math.floor(px / cellSize) * cellSize;
      const cellY = Math.floor(py / cellSize) * cellSize;

      pushUndoSnapshot();
      const newValue = dotState[cellY][cellX] ? 0 : 1;
      for (let dy = 0; dy < cellSize; dy++) {
        for (let dx = 0; dx < cellSize; dx++) {
          dotState[cellY + dy][cellX + dx] = newValue;
        }
      }

      render();
    });

    // ズーム/パンの位置がキャンバスの範囲外にはみ出さないように制限する
    function clampPan() {
      const displaySize = VIEWPORT_SIZE * zoomScale;
      const minPan = Math.min(0, VIEWPORT_SIZE - displaySize);
      panX = Math.min(0, Math.max(minPan, panX));
      panY = Math.min(0, Math.max(minPan, panY));
    }

    function applyCanvasTransform() {
      previewCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
    }

    // トラックパッドのピンチ操作(ctrlKey付きwheel)で拡大縮小、2本指スクロールでパンする
    canvasViewport.addEventListener('wheel', (e) => {
      if (!dotState) return;
      e.preventDefault();

      if (e.ctrlKey) {
        const rect = canvasViewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // カーソル位置の下にある画像座標を、拡大後も同じ画面位置に留める
        const canvasX = (mouseX - panX) / zoomScale;
        const canvasY = (mouseY - panY) / zoomScale;

        const zoomFactor = Math.exp(-e.deltaY * 0.01);
        const newScale = Math.min(Math.max(zoomScale * zoomFactor, MIN_ZOOM), MAX_ZOOM);

        panX = mouseX - canvasX * newScale;
        panY = mouseY - canvasY * newScale;
        zoomScale = newScale;
      } else {
        panX -= e.deltaX;
        panY -= e.deltaY;
      }

      clampPan();
      applyCanvasTransform();
    }, { passive: false });

    // 画像からドット状態を生成する処理（画像読み込み時のみ実行。既存の手動編集はここでリセットされる）
    function processImage() {
      const blockSize = parseInt(blockSizeInput.value, 10);

      // 1. ソースをクリア
      sourceCtx.clearRect(0, 0, 128, 128);

      // --- レトロフィルター（チャンキー化）処理 ---
      if (blockSize > 1) {
        // 画像を極小サイズ（例：32x32）の裏キャンバスに一度描画する
        const tempCanvas = document.createElement('canvas');
        const tempSize = 128 / blockSize;
        tempCanvas.width = tempSize;
        tempCanvas.height = tempSize;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(currentImg, 0, 0, tempSize, tempSize);

        // アンチエイリアス（ぼかし）を無効化して、元の128x128にカクカクのまま引き伸ばして描画
        sourceCtx.imageSmoothingEnabled = false;
        sourceCtx.drawImage(tempCanvas, 0, 0, tempSize, tempSize, 0, 0, 128, 128);
      } else {
        // そのまま描画
        sourceCtx.imageSmoothingEnabled = true;
        sourceCtx.drawImage(currentImg, 0, 0, 128, 128);
      }
      // ------------------------------------------

      const threshold = 127; // しきい値は127で固定
      const imgData = sourceCtx.getImageData(0, 0, 128, 128);
      const data = imgData.data;

      // 2. ピクセルごとにON/OFFを判定してドット状態を構築
      dotState = [];
      for (let y = 0; y < 128; y++) {
        const row = [];
        for (let x = 0; x < 128; x++) {
          const i = ((y * 128) + x) * 4;
          const r = data[i];
          const g = data[i + 1];
          const color_b = data[i + 2];
          const a = data[i + 3];

          // グレースケール化してしきい値判定
          const brightness = (r + g + color_b) / 3;
          row.push((a > 127 && brightness > threshold) ? 1 : 0);
        }
        dotState.push(row);
      }

      resetHistory();
      render();
    }

    // 現在のドット状態（手動編集済み）に対してモザイク（レトロフィルター）を再適用する
    // 元画像には戻さず、blockSize x blockSizeのブロックごとに多数決でON/OFFをまとめ直す
    function reapplyRetroFilter(blockSize) {
      pushUndoSnapshot();

      const newState = [];
      for (let y = 0; y < 128; y++) newState.push(new Array(128).fill(0));

      for (let by = 0; by < 128; by += blockSize) {
        for (let bx = 0; bx < 128; bx += blockSize) {
          let onCount = 0;
          for (let dy = 0; dy < blockSize; dy++) {
            for (let dx = 0; dx < blockSize; dx++) {
              if (dotState[by + dy][bx + dx]) onCount++;
            }
          }
          const value = (onCount * 2 >= blockSize * blockSize) ? 1 : 0;
          for (let dy = 0; dy < blockSize; dy++) {
            for (let dx = 0; dx < blockSize; dx++) {
              newState[by + dy][bx + dx] = value;
            }
          }
        }
      }

      dotState = newState;
      render();
    }

    // 現在のドット状態からプレビューとC++コードを描画する
    function render() {
      // プレビュー用の黒背景クリア
      previewCtx.fillStyle = '#000000';
      previewCtx.fillRect(0, 0, 128, 128);

      // 入力された配列名を取得（空欄の場合はデフォルト名を設定）
      const arrayName = arrayNameInput.value.trim() || 'FULL_FACE_IMG';

      let cppCode = `// 128x128 Face Data (1-bit)\n`;
      cppCode += `const uint8_t ${arrayName}[2048] = {\n`;

      for (let y = 0; y < 128; y++) {
        let rowBits = [];
        for (let x = 0; x < 128; x += 8) {
          let byte = 0;
          for (let b = 0; b < 8; b++) {
            const px = x + b;
            const isDotOn = dotState[y][px];

            byte |= (isDotOn << (7 - b));

            // プレビューキャンバスへの描画 (ONなら白を打つ)
            if (isDotOn) {
              previewCtx.fillStyle = '#FFFFFF';
              previewCtx.fillRect(px, y, 1, 1);
            }
          }
          rowBits.push(`0x${byte.toString(16).padStart(2, '0')}`);
        }
        cppCode += `  ${rowBits.join(', ')},\n`;
      }
      cppCode += `};\n`;

      output.value = cppCode;

      // --- ドットグリッドのオーバーレイ描画 ---
      if (showGridInput.checked) {
        drawDotGrid(currentCellSize);
      }
      // ----------------------------------------
    }

    // dotStateからプレビューキャンバスのみを再描画する（コード欄の内容は書き換えない）
    function drawPreview() {
      previewCtx.fillStyle = '#000000';
      previewCtx.fillRect(0, 0, 128, 128);
      previewCtx.fillStyle = '#FFFFFF';
      for (let y = 0; y < 128; y++) {
        for (let x = 0; x < 128; x++) {
          if (dotState[y][x]) previewCtx.fillRect(x, y, 1, 1);
        }
      }
      if (showGridInput.checked) {
        drawDotGrid(currentCellSize);
      }
    }

    // C++配列コードの文字列を解析して128x128のドット状態に変換する（形式が不正ならnull）
    function parseCodeToDotState(code) {
      const matches = code.match(/0x[0-9a-fA-F]{1,2}/g);
      if (!matches || matches.length !== 128 * 16) return null;

      const bytes = matches.map(hex => parseInt(hex, 16));
      const newState = [];
      let idx = 0;
      for (let y = 0; y < 128; y++) {
        const row = [];
        for (let x = 0; x < 128; x += 8) {
          const byte = bytes[idx++];
          for (let b = 0; b < 8; b++) {
            row.push((byte >> (7 - b)) & 1);
          }
        }
        newState.push(row);
      }
      return newState;
    }

    // コード欄が手動編集されたらドット状態とプレビューに反映する
    output.addEventListener('input', () => {
      if (!dotState) return;
      const parsed = parseCodeToDotState(output.value);
      if (!parsed) return;

      pushUndoSnapshot();
      dotState = parsed;
      drawPreview();
    });

    // ドット（セル）の境界に沿ったグリッド線を描画する
    function drawDotGrid(cellSize) {
      previewCtx.save();
      previewCtx.strokeStyle = 'rgba(255, 0, 0, 0.35)';
      previewCtx.lineWidth = 1;
      for (let pos = 0; pos <= 128; pos += cellSize) {
        // 縦線
        previewCtx.beginPath();
        previewCtx.moveTo(pos + 0.5, 0);
        previewCtx.lineTo(pos + 0.5, 128);
        previewCtx.stroke();
        // 横線
        previewCtx.beginPath();
        previewCtx.moveTo(0, pos + 0.5);
        previewCtx.lineTo(128, pos + 0.5);
        previewCtx.stroke();
      }
      previewCtx.restore();
    }

    // コピー機能
    copyBtn.addEventListener('click', () => {
      output.select();
      document.execCommand('copy');
      const originalText = copyBtn.textContent;
      copyBtn.textContent = 'コピー完了！';
      setTimeout(() => copyBtn.textContent = originalText, 2000);
    });

    // PNGエクスポート機能（グリッド線は含めず、ドット状態のみを描画する）
    exportPngBtn.addEventListener('click', () => {
      if (!dotState) return;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 128;
      exportCanvas.height = 128;
      const exportCtx = exportCanvas.getContext('2d');

      exportCtx.fillStyle = '#000000';
      exportCtx.fillRect(0, 0, 128, 128);
      exportCtx.fillStyle = '#FFFFFF';
      for (let y = 0; y < 128; y++) {
        for (let x = 0; x < 128; x++) {
          if (dotState[y][x]) exportCtx.fillRect(x, y, 1, 1);
        }
      }

      const arrayName = arrayNameInput.value.trim() || 'FULL_FACE_IMG';
      const link = document.createElement('a');
      link.download = `${arrayName}.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
